# PHINOX nginx reverse proxy — Phase 6 STITCH-INTEGRATION hardening.
#
# Per دستور §11 + §5 security headers:
#   - Reverse proxy to web:8000 (gunicorn).
#   - Serve /static/ directly (WhiteNoise in prod, but nginx is faster
#     for high-traffic static assets on Hetzner's Hetzner-CDN-fronted box).
#   - gzip + brotli (nginx 1.27 ships with brotli in alpine image).
#   - Security headers: CSP, HSTS, X-Frame-Options, X-Content-Type-Options.
#   - client_max_body_size 20M (matches Django's FILE_UPLOAD_MAX_MEMORY_SIZE).
#
# PHASE-D §D1 — Rate limiting (per دستور §5 security best-practices):
#   - /accounts/login/                      → 5 req/min per IP, burst 10
#   - /accounts/password/reset/             → 3 req/min per IP, burst 5
#   - /payments/webhooks/paymob/            → 100 req/min per IP, burst 200
#   The login + password-reset limits prevent brute-force attacks. The
#   webhook limit is generous (Paymob retries on 5xx — too tight a limit
#   would cause retry storms) but still protects against a misconfigured
#   Paymob account spamming us.
#
# TLS:
#   - Listen on 443 with the cert from /etc/nginx/certs/ (mounted volume).
#   - Redirect 80 → 443 for the prod domain.
#   - In staging / dev, the 80→443 redirect is optional (set via env).

# ── PHASE-D §D1: rate-limit zones (declared at http {} scope via
#    limit_req_zone — these directives are valid inside the http {} block
#    which is implied by Docker nginx:alpine's default.conf include). ────
#    $binary_remote_addr keys on the client IP (4 bytes hashed). The
#    zone size 10m holds ~160,000 unique IPs in memory.
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=password_reset_limit:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=paymob_webhook_limit:10m rate=100r/m;

upstream phinox_app {
    server web:8000;
    keepalive 32;
}

# ─── HTTP → HTTPS redirect (production) ───────────────────────────────────
server {
    listen 80;
    server_name _;

    # /health/ is served on plain HTTP so Docker HEALTHCHECK + load balancer
    # probes don't need TLS certs (per دستور §11).
    location /health/ {
        proxy_pass http://phinox_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Per دستور §5: SECURE_SSL_REDIRECT=True in prod. nginx handles
        # the actual redirect (Django just sets the HSTS header).
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name _;

    # TLS cert + key mounted from the host's cert volume.
    # In dev / staging without certs, use the HTTP-only server block above.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;  # Let the client choose (per Mozilla intermediate)
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20M;

    # ─── Security headers (per دستور §5) ───────────────────────────────
    # CSP: allow same-origin + the Google Fonts CDN (per Phase 6 spec —
    # Material Symbols + Hanken Grotesk + Archivo Narrow + JetBrains Mono).
    # Script-src allows unpkg.com (htmx) + cdn.tailwindcss.com (dev only —
    # prod uses compiled dist.css, so this is a no-op in prod).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://fonts.googleapis.com; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ─── Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # ─── Static files (WhiteNoise already serves these — nginx is a CDN
    # layer for high-traffic prod; the alias points to the shared volume) ──
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Media files (S3 in prod, local filesystem in dev/staging) ────
    # In prod with S3, this block is a no-op (media URLs point to S3 CDN).
    # In dev / staging with local filesystem, nginx serves /media/ directly.
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ─── Health check (so nginx doesn't proxy health probes when gunicorn
    # is unresponsive — Docker HEALTHCHECK already probes web directly) ──
    location /health/ {
        proxy_pass http://phinox_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ── PHASE-D §D1: rate-limited paths ─────────────────────────────────
    # Login: 5 req/min per IP, burst 10 (the burst absorbs a double-click
    # + a slow retry; sustained brute-force gets 429s).
    location = /accounts/login/ {
        limit_req zone=login_limit burst=10 nodelay;
        proxy_pass http://phinox_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Password reset: 3 req/min per IP, burst 5 (tighter than login —
    # password reset is rarely called more than once legitimately).
    location = /accounts/password/reset/ {
        limit_req zone=password_reset_limit burst=5 nodelay;
        proxy_pass http://phinox_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Paymob webhook: 100 req/min per IP, burst 200 (Paymob retries on 5xx
    # — too tight a limit causes retry storms; 100/min is generous but
    # still blocks a malicious spam attack).
    location = /payments/webhooks/paymob/ {
        limit_req zone=paymob_webhook_limit burst=200 nodelay;
        proxy_pass http://phinox_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Main reverse proxy to gunicorn ────────────────────────────────
    location / {
        proxy_pass http://phinox_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
