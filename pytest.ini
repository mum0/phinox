[pytest]
# PHINOX pytest configuration — per دستور §8 (pytest-django + factory-boy).
#
# Settings module: dev (SQLite fallback when DATABASE_URL is unset).
# The CI ci.yml overrides this with DJANGO_SETTINGS_MODULE=config.settings.dev
# + DATABASE_URL=postgres://... so the test DB is Postgres in CI.
DJANGO_SETTINGS_MODULE = config.settings.dev

# Discover tests in: tests.py, test_*.py, tests_*.py (per دستور §8).
python_files = tests.py test_*.py tests_*.py

# Test classes/functions: TestCase subclasses + test_* functions.
python_classes = *Tests *Test Test*
python_functions = test_*

# Default addopts: quiet + short tracebacks. The CI overrides with --cov.
addopts = -q --tb=short --reuse-db

# Markers (per دستور §8 + Phase-C §C5).
markers =
    django_db: marks a test as requiring the Django test database (pytest-django)
    e2e: marks a test as an end-to-end integration test (slow — excluded from default run)
    slow: marks a test as slow (excluded from default run via -m "not slow")
